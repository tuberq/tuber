[package]
name = "tuber"
version = "0.15.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"
crc32fast = "1"
libc = "0.2"
# Already built through tokio (which enables "all"); depended on directly for
# TCP keepalive timings, which tokio's TcpStream doesn't expose.
socket2 = { version = "0.6", features = ["all"] }
tikv-jemallocator = "0.6.1"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
jiff = "0.2"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "throughput"
harness = false
