[package]
name = "tuber"
version = "0.16.0"
edition = "2024"
# ee/ is BUSL-1.1 (ee/LICENSE); everything else is MIT (LICENSE).
license = "MIT AND BUSL-1.1"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"
crc32fast = "1"
libc = "0.2"
# Already built through tokio (which enables "all"); depended on directly for
# TCP keepalive timings, which tokio's TcpStream doesn't expose.
socket2 = { version = "0.6", features = ["all"] }
tikv-jemallocator = "0.6.1"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
# Bundled tzdb: the fallback for a zone the host's database lacks
# (`spec::Zone::get`).
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "throughput"
harness = false

# ee/'s tests live beside it, outside tests/, so the BUSL code stays in one
# directory.
[[test]]
name = "ee_stream"
path = "ee/tests/stream_test.rs"

[[test]]
name = "ee_catchup"
path = "ee/tests/catchup_test.rs"

[[test]]
name = "ee_binary"
path = "ee/tests/binary_test.rs"

# Compiles ee/ as a separate crate would see tuber; see the file.
[[test]]
name = "ee_boundary"
path = "ee/tests/boundary.rs"
