[package]
name = "tuber"
version = "0.16.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"
crc32fast = "1"
libc = "0.2"
# Already built through tokio (which enables "all"); depended on directly for
# TCP keepalive timings, which tokio's TcpStream doesn't expose.
socket2 = { version = "0.6", features = ["all"] }
tikv-jemallocator = "0.6.1"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
# Bundled tzdb: the fallback for a zone the host's database lacks
# (`spec::Zone::get`).
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "throughput"
harness = false
